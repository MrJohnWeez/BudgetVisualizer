[project]
name = "budgetvisulizer"
version = "0.1.0"
description = "Simple scripts to visualize monthly budgets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "plotly>=6.6.0",
    "dash2html>=1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "FBT001", # Boolean-typed positional argument in function definition
    "FBT002", # Boolean default positional argument in function definition
    "PLR0913", # Too many arguments in function definition
    "CPY001", # No Copyright at top of file
    "D203", # Blank line before class docstring (conflicts with D211)
    "D213", # Multi-line summary on second line (conflicts with D212)
    "COM812", # Missing trailing comma (conflicts with the formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

include = ["."]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/dist",
    "**/build",
    "**/node_modules",
    "**/.*"]

reportMissingImports = true